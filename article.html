<!DOCTYPE html>
<html lang="fr" class="i18n-wait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actualité — CPCREDO</title>
    <meta name="description" content="Actualité CPCREDO." />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>html.i18n-wait body{visibility:hidden}</style>
    <noscript><style>html.i18n-wait body{visibility:visible}</style></noscript>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("lang");
          var s = localStorage.getItem("cpcredo-lang");
          var l = q === "ht" || q === "fr" ? q : s === "ht" || s === "fr" ? s : "fr";
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-page="news">
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Aller au contenu</a>
    <!--HEADER-->
    <main id="main">
      <article class="page-hero container" data-article-root>
        <p class="kicker" data-i18n="news.kicker">Actualités</p>
        <p><time class="meta" data-article-date>[À CONFIRMER]</time></p>
        <h1 data-article-title>Actualité</h1>
        <div class="article-body" data-article-body></div>
        <p style="margin-top:2rem">
          <a class="btn btn-ghost" href="./actualites.html" data-i18n="news.back">Retour aux actualités</a>
        </p>
      </article>
    </main>
    <!--FOOTER-->
    <!--FAB-->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
