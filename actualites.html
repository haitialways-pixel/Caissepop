<!DOCTYPE html>
<html lang="fr" class="i18n-wait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actualités — CPCREDO</title>
    <meta name="description" content="Annonces et rendez-vous de CPCREDO à Pétion-Ville." />
    <meta name="theme-color" content="#07111f" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>html.i18n-wait body{visibility:hidden}</style>
    <noscript><style>html.i18n-wait body{visibility:visible}</style></noscript>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("lang");
          var s = localStorage.getItem("cpcredo-lang");
          var l = q === "ht" || q === "fr" ? q : s === "ht" || s === "fr" ? s : "fr";
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-page="news" data-title-key="meta.newsTitle" data-desc-key="meta.newsDesc">
    <a class="skip-link" href="#main" data-i18n="a11y.skip">Aller au contenu</a>
    <!--HEADER-->
    <main id="main">
      <header class="page-hero container">
        <p class="kicker" data-i18n="news.kicker">Actualités</p>
        <h1 data-i18n="news.title">Le journal de la caisse</h1>
        <p class="lead" data-i18n="news.lead"></p>
      </header>
      <section class="section">
        <div class="container grid-3">
          <article class="glass card news-card">
            <p class="meta" data-i18n="news.a1k"></p>
            <h2 data-i18n="news.a1t"></h2>
            <p data-i18n="news.a1b"></p>
            <p class="tbc" data-i18n="news.a1d"></p>
          </article>
          <article class="glass card news-card">
            <p class="meta" data-i18n="news.a2k"></p>
            <h2 data-i18n="news.a2t"></h2>
            <p data-i18n="news.a2b"></p>
            <p class="tbc" data-i18n="news.a2d"></p>
          </article>
          <article class="glass card news-card">
            <p class="meta" data-i18n="news.a3k"></p>
            <h2 data-i18n="news.a3t"></h2>
            <p data-i18n="news.a3b"></p>
            <p class="tbc" data-i18n="news.a3d"></p>
          </article>
        </div>
      </section>
    </main>
    <!--FOOTER-->
    <!--FAB-->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
